# Keeps the Supabase free-tier project from pausing (it pauses after 7 idle days).
# Runs every 3 days. Two independent pings:
#   1. The deployed site's /api/health (set repository variable SITE_URL, e.g. https://vgbd.netlify.app)
#   2. Supabase REST directly (set secrets SUPABASE_URL and SUPABASE_ANON_KEY) - works even before
#      the site is deployed.
name: keepalive

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Ping /api/health
        if: ${{ env.SITE_URL != '' }}
        run: |
          set -e
          url="${SITE_URL%/}/api/health"
          echo "GET $url"
          curl --fail --silent --show-error --max-time 30 "$url"
          echo

      - name: Ping Supabase REST
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_ANON_KEY != '' }}
        run: |
          set -e
          curl --fail --silent --show-error --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "${SUPABASE_URL%/}/rest/v1/bd_locations?select=id&limit=1"
          echo

      - name: Nothing configured
        if: ${{ env.SITE_URL == '' && env.SUPABASE_URL == '' }}
        run: echo "Set repository variable SITE_URL and/or secrets SUPABASE_URL + SUPABASE_ANON_KEY."
